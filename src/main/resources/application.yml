spring:
  datasource:
    url: jdbc:h2:mem:depositdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  jackson:
    serialization:
      write-dates-as-timestamps: false

pg:
  fee-rate:
    card: 0.035      # 3.5%
    bank-transfer: 0.005  # 0.5%
  refund-free-days: 30
